<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💘 Valentine 💘</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    h1 {
      color: white;
      text-align: center;
      font-size: 2.4rem;
      margin-bottom: 40px;
      animation: slideUp 1.5s ease forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .buttons {
      position: relative;
      width: 320px;
      height: 160px;
    }

    button {
      padding: 14px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    #yes {
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      position: absolute;
      left: 40px;
      bottom: 25px;
    }

    #no {
      background: linear-gradient(135deg, #ff6a88, #ff99ac);
      color: white;
      position: absolute;
      right: 40px;
      bottom: 25px;
    }

    .heart {
      position: absolute;
      font-size: 18px;
      animation: floatUp 7s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 0; }
      to { transform: translateY(-110vh); opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine, Minakshi? ❤️</h1>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">YES 💖</button>
    <button id="no" onmouseover="moveNo()">NO 💔</button>
  </div>

  <script>
    function moveNo() {
      const noBtn = document.getElementById("no");
      noBtn.style.left = Math.random() * 220 + "px";
      noBtn.style.top = Math.random() * 120 + "px";
    }

    function yesClicked() {
      document.body.innerHTML = `
        <h1 style="font-size:2.2rem; line-height:1.5;">
          Yayyy! 💕<br><br>
          Please msg me on WhatsApp<br>
          if you accept 💖
        </h1>
      `;
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 400);
  </script>

</body>
</html>
